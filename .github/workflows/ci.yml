name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Verify unpacked extension artifact
        shell: bash
        run: |
          test -s dist-extension/manifest.json
          test -s dist-extension/service-worker.js
          test -s dist-extension/content-script.js
          test -s dist-extension/popup.js
          test -s dist-extension/popup.html
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('dist-extension/manifest.json','utf8')); if(m.manifest_version!==3 || m.background?.service_worker!=='service-worker.js' || m.action?.default_popup!=='popup.html') process.exit(1)"
      - name: CLI smoke
        run: node bin/chat2codex.js --help
      - name: Relay acceptance help smoke
        run: node scripts/acceptance-relay.mjs --help
      - name: Upload unpacked extension
        if: ${{ matrix.node == 22 }}
        uses: actions/upload-artifact@v4
        with:
          name: chat2codex-extension-unpacked
          path: dist-extension/
          if-no-files-found: error
          retention-days: 14
