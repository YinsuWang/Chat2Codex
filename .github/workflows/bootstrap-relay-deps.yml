name: Bootstrap relay dependencies

on:
  push:
    branches:
      - feat/v1-integration-transport
    paths:
      - '.github/workflows/bootstrap-relay-deps.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
      - name: Add relay dependencies
        run: |
          pnpm add ws@^8.18.0
          pnpm add -D @types/ws@^8.5.0 esbuild@^0.25.0
      - name: Commit generated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "build: add relay dependencies"
          git push origin HEAD:feat/v1-integration-transport
